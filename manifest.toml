packaging_format = 2

id = "mesh2motion"
name = "Mesh2Motion"
description.en = "Web application to animate your 3D models"
description.fr = "Application web pour animer vos modèles 3D"

version = "2025.10.21~ynh1"

maintainers = ["oleole39"]

[upstream]
license = "MIT"
website = "https://mesh2motion.org"
demo = "https://app.mesh2motion.org"
admindoc = "https://yunohost.org/packaging_apps"
userdoc = "https://mesh2motion.org/#walkthrough"
code = "https://github.com/oleole39/mesh2motion-app"
fund = "https://github.com/scottpetrovic/mesh2motion-app/#contribute-to-the-animation-fund"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "false"
sso = "false"

# FIXME: replace with an **estimate** minimum disk and RAM requirements. e.g. 20M, 400M, 1G...
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mesh2motion"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        # This is not used as we are using git clone. It's only here for autoupdate.
        url = "https://github.com/oleole39/mesh2motion-app/archive/735a3ccd7f9000e653f968596a71129f09f28cd9.tar.gz"
        sha256 = "8a63a80adc01d0d66097a11d8b02c3af46eb538cfbb0a97b6e859ca2d52cd2c9"
        prefetch = false
        autoupdate.strategy = "latest_github_commit"
        
        [resources.sources.ynh_build]
        url = "https://github.com/oleole39/mesh2motion_ynh/releases/download/v2025.10.21-a65ae101/mesh2motion-app_v2025.10.21-a65ae101_ynh.zip"
        sha256 = "2b8625c097c02e587793995590bd9d4c8b75ad1be50dc4f3c2b18e313cce868"
        format = "zip"
        extract = true
        in_subdir = true

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
